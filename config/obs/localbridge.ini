[General]
Name=localbridge

[Video]
BaseCX=1920
BaseCY=1080
OutputCX=1920
OutputCY=1080
FPSType=0
FPSCommon=60
FPSInt=30
FPSNum=30
FPSDen=1
ScaleType=bicubic
ColorFormat=NV12
ColorSpace=709
ColorRange=Partial

[Output]
Mode=Simple
Reconnect=true
RetryDelay=2
MaxRetries=25

[SimpleOutput]
VBitrate=15000
ABitrate=160
# x264 is required. Fedora's OpenH264 emits a video track with no SPS, which Streamlabs
# cannot decode, so the preview stays black even though the stream is flowing.
StreamEncoder=x264
StreamAudioEncoder=aac
RecFormat2=hybrid_mp4
RecEncoder=x264
UseAdvanced=false
Preset=veryfast
RecQuality=Stream

[AdvOut]
Encoder=x264
AudioEncoder=aac

[Audio]
SampleRate=48000
ChannelSetup=Stereo
